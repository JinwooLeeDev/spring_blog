server:
  port: 5000

logging:
  level:
    root: INFO                      # 스프링과 라이브러리는 INFO 이상만
    com.tenco.spring_blog: DEBUG    # 우리 코드는 DEBUG 이상까지

spring:
  # 데이터 베이스 연결 (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/myblog?serverTimezone=Asia/Seoul
    username: root
    password: 1234

  # JPA 설정
  jpa:
    hibernate:
      # 운영환경에서는 create를 쓰지 않는다. 없는 테이블과 컬럼만 추가한다.
      ddl-auto: update
    # 실행되는 SQL을 콘솔에 출력한다.
    show-sql: true
    # 추후에 data.sql을 테이블 생성후에 실행한다.
    defer-datasource-initialization: true